
<!DOCTYPE html>

<meta property="og:image" content="https://YOUR-DOMAIN/newyear2027-preview.jpg">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
 width:100%;height:100%;overflow:hidden;
 background:#050403;color:#ffe4a0;
 font-family:Arial,sans-serif;
 overscroll-behavior:none;
}
body{
 display:flex;align-items:center;justify-content:center;
}
#app{
 position:relative;
 width:min(100vw,56.25svh);
 height:min(100svh,177.7778vw);
 aspect-ratio:9/16;
 overflow:hidden;
 background:
 radial-gradient(ellipse at 50% 35%,#38240d 0%,#100c07 48%,#030303 100%);
 border:1px solid #a98237;
}
#main{
 position:absolute;inset:0;
 display:flex;flex-direction:column;
 align-items:center;justify-content:space-around;
 padding:5% 6%;
 text-align:center;
}
.logo{
 color:#f9d77b;font-size:clamp(16px,4vw,23px);
 font-weight:900;letter-spacing:4px;
 text-shadow:0 0 15px #e5ad38;
}
.small{font-size:9px;letter-spacing:4px;color:#b89b60;margin-top:5px}
.title{
 font-family:Georgia,serif;
 font-size:clamp(28px,8vw,48px);
 color:#fce4a2;
 text-shadow:0 0 20px #d69a35;
}
.year{
 font-family:Georgia,serif;
 font-size:clamp(70px,21vw,112px);
 font-weight:bold;
 line-height:1;
 background:linear-gradient(#fff4b6,#dca43d,#fff0a5);
 -webkit-background-clip:text;
 background-clip:text;color:transparent;
 filter:drop-shadow(0 0 15px #c48a27);
}
.subtitle{font-size:12px;line-height:1.7;color:#ddc99e}
.countTitle{font-size:10px;letter-spacing:3px;color:#e8c87e}
.timer{display:flex;gap:5px;justify-content:center;width:100%}
.unit{
 flex:1;min-width:0;padding:10px 2px;
 background:linear-gradient(145deg,#2a1c0b,#090704);
 border:1px solid #9b742e;border-radius:9px;
}
.unit b{display:block;font-size:clamp(19px,5vw,27px);color:#ffe5a0}
.unit span{font-size:8px;letter-spacing:1px;color:#bca16a}
.panel{
 width:100%;padding:12px;
 border:1px solid #94702d;border-radius:13px;
 background:#130e08dd;
}
.panelTitle{font-family:Georgia;font-size:16px;margin-bottom:8px;color:#ffe3a0}
input,textarea{
 width:100%;background:#080705;
 border:1px solid #8c692d;border-radius:7px;
 padding:11px;color:#fff0c3;
 font-size:12px;outline:none;margin:4px 0;
}
textarea{height:63px;resize:none}
button{
 border:0;border-radius:30px;padding:12px 18px;
 background:linear-gradient(100deg,#a87520,#ffe8a4,#bc862d);
 color:#170f03;font-weight:bold;font-size:12px;
}
.send{width:100%;margin-top:6px}
.footer{font-size:9px;color:#a78d58;letter-spacing:2px}

/* Opening animation */
#intro{
 position:absolute;inset:0;z-index:10;
 background:radial-gradient(ellipse at center,#1b1208,#020202 75%);
 display:none;overflow:hidden;
}
#intro.show{display:block}
#sky{position:absolute;inset:0;width:100%;height:100%}
#introText{
 position:absolute;left:5%;right:5%;top:43%;
 transform:translateY(30px);
 opacity:0;text-align:center;
 animation:textIn .8s ease .5s forwards;
}
@keyframes textIn{
 to{opacity:1;transform:translateY(0)}
}
.introYear{
 font-family:Georgia;font-size:clamp(45px,14vw,75px);
 color:#ffdf8c;text-shadow:0 0 25px #e9ad3d;
}
.introWish{
 font-family:Georgia;font-size:18px;
 color:#fff0c0;line-height:1.6;margin-top:12px;
 overflow-wrap:anywhere;
}
.introSender{font-size:13px;color:#e9c67c;margin-top:14px}
#skip{
 position:absolute;bottom:5%;right:5%;
 border:1px solid #b68c43;border-radius:20px;
 background:#100b07;color:#f8d98d;
 font-size:10px;padding:8px 14px;
}
</style>
</head>

<body>
<div id="app">

<!-- MAIN PAGE -->
<main id="main">

 <header>
  <div class="logo">VRPAIData</div>
  <div class="small">SPREADING HAPPINESS</div>
 </header>

 <section>
  <div class="title">Happy New Year</div>
  <div class="year">2027</div>
  <p class="subtitle">
   புதிய நம்பிக்கை • புதிய கனவுகள்<br>
   A Beautiful New Beginning ❤️
  </p>
 </section>

 <section style="width:100%">
  <div class="countTitle">NEW YEAR COUNTDOWN</div>
  <div class="timer" style="margin-top:10px">
   <div class="unit"><b id="days">00</b><span>DAYS</span></div>
   <div class="unit"><b id="hours">00</b><span>HOURS</span></div>
   <div class="unit"><b id="minutes">00</b><span>MINUTES</span></div>
   <div class="unit"><b id="seconds">00</b><span>SECONDS</span></div>
  </div>
 </section>

 <section class="panel">
  <div class="panelTitle">💌 Send Your Wishes</div>

  <input id="sender" placeholder="அனுப்புநர் பெயர் / Sender Name">

  <textarea id="wish">🪔 இனிய புத்தாண்டு நல்வாழ்த்துக்கள்! ❤️

உங்கள் வாழ்க்கையில் மகிழ்ச்சி பெருகட்டும்.
நினைத்த கனவுகள் அனைத்தும் நனவாகட்டும்.
ஆரோக்கியம், அன்பு, அமைதி என்றும் நிலைத்திருக்கட்டும்!

✨ Happy New Year 2027!
Wishing You Love, Happiness & Success!</textarea>

  <button class="send" onclick="sendWish()">
   🎁 SEND WISHES
  </button>
  <div id="status" style="font-size:10px;margin-top:7px;color:#e5c77e"></div>
 </section>

 <footer class="footer">
  WITH LOVE ❤️ VRPAIData
 </footer>

</main>

<!-- RECEIVER OPENING ANIMATION -->
<div id="intro">
 <canvas id="sky"></canvas>

 <div id="introText">
  <div style="font-size:13px;letter-spacing:3px;color:#e9c67c">
   A SPECIAL WISH FOR YOU
  </div>
  <div class="introYear">2027</div>
  <div class="introWish" id="showWish"></div>
  <div class="introSender" id="showSender"></div>
 </div>

 <button id="skip" onclick="finishIntro()">SKIP ✕</button>
</div>

</div>

<script>
// COUNTDOWN
function timer(){
 const target=new Date("2027-01-01T00:00:00+05:30").getTime();
 let t=Math.max(0,target-Date.now());

 document.getElementById("days").textContent=
 String(Math.floor(t/86400000)).padStart(2,"0");
 document.getElementById("hours").textContent=
 String(Math.floor(t%86400000/3600000)).padStart(2,"0");
 document.getElementById("minutes").textContent=
 String(Math.floor(t%3600000/60000)).padStart(2,"0");
 document.getElementById("seconds").textContent=
 String(Math.floor(t%60000/1000)).padStart(2,"0");
}
timer();
setInterval(timer,1000);

// GENERATE PERSONAL WISH LINK
function sendWish(){
 const name=document.getElementById("sender").value.trim();
 const message=document.getElementById("wish").value.trim();

 if(!name){
  alert("அனுப்புநர் பெயரை உள்ளிடவும்!");
  return;
 }

 const url=new URL(location.href);
 url.search="";
 url.searchParams.set("sender",name);
 url.searchParams.set("wish",message);

 const link=url.toString();

 const shareText=
 "🎆 Happy New Year 2027! 🎆\n\n"+
 "உங்களுக்காக ஒரு அன்பான புத்தாண்டு வாழ்த்து! ❤️\n\n"+
 link;

 if(navigator.share){
  navigator.share({
   title:"Happy New Year 2027",
   text:shareText,
   url:link
  }).catch(()=>{});
 }else{
  window.open(
   "https://wa.me/?text="+encodeURIComponent(shareText),
   "_blank"
  );
 }

 document.getElementById("status").textContent=
 "❤️ உங்கள் வாழ்த்து Share செய்யத் தயாராக உள்ளது!";
}

// FIREWORKS ENGINE
const canvas=document.getElementById("sky");
const ctx=canvas.getContext("2d");
let W=0,H=0,particles=[],rockets=[];
let animationActive=false;

function resize(){
 const dpr=Math.min(devicePixelRatio||1,2);
 W=canvas.clientWidth;
 H=canvas.clientHeight;
 canvas.width=W*dpr;
 canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener("resize",resize);

function rocket(){
 rockets.push({
  x:W*(.12+Math.random()*.76),
  y:H+10,
  target:H*(.12+Math.random()*.35),
  speed:7+Math.random()*5,
  hue:Math.random()*360
 });
}

// 13 DISTINCT FIREWORK STYLES
function burst(x,y,type,hue){
 const count=type===12?110:65;

 for(let i=0;i<count;i++){
  let angle=Math.PI*2*i/count;
  let speed=2+Math.random()*3.5;
  let vx=Math.cos(angle)*speed;
  let vy=Math.sin(angle)*speed;

  switch(type){
   case 0: break; // Circle
   case 1: speed=3; break; // Chrysanthemum
   case 2: speed=i%2?4:1.5; break; // Star
   case 3: speed=2+Math.random()*6; break; // Peony
   case 4: vx*=.5;vy*=1.6;break; // Willow
   case 5: vx*=1.5;vy*=.7;break; // Ring
   case 6: speed=i%3?2:5;break; // Multi-layer
   case 7: angle=Math.PI*2*(Math.floor(i/5)/13);break;
   case 8: vx=Math.cos(angle)*speed*1.5;break;
   case 9: vy=Math.sin(angle)*speed*1.5;break;
   case 10: speed=4+Math.sin(i)*2;break;
   case 11: speed=2+Math.random()*7;break;
   case 12: speed=1+Math.random()*6;break;
  }

  particles.push({
   x,y,vx,vy,life:1,
   decay:.009+Math.random()*.013,
   size:1+Math.random()*2.5,
   hue:hue+Math.random()*35,
   type
  });
 }
}

function animate(){
 if(!animationActive)return;

 ctx.clearRect(0,0,W,H);

 // Rocket launch from bottom to top
 rockets.forEach((r,i)=>{
  r.y-=r.speed;
  ctx.fillStyle="#ffe5a0";
  ctx.shadowBlur=12;
  ctx.shadowColor="#ffbd44";
  ctx.beginPath();
  ctx.arc(r.x,r.y,3,0,Math.PI*2);
  ctx.fill();

  if(r.y<=r.target){
   burst(r.x,r.y,Math.floor(Math.random()*13),r.hue);
   rockets.splice(i,1);
  }
 });

 // Explosion particles
 particles.forEach((p,i)=>{
  p.x+=p.vx;
  p.y+=p.vy;
  p.vy+=.035;
  p.vx*=.985;
  p.vy*=.985;
  p.life-=p.decay;

  ctx.globalAlpha=Math.max(0,p.life);
  ctx.fillStyle=`hsl(${p.hue},100%,70%)`;
  ctx.shadowBlur=8;
  ctx.shadowColor=ctx.fillStyle;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
  ctx.fill();

  if(p.life<=0)particles.splice(i,1);
 });

 ctx.globalAlpha=1;
 ctx.shadowBlur=0;
 requestAnimationFrame(animate);
}

// Launch 13 different bursts over 5 seconds
let introTimers=[];
function startIntro(){
 const params=new URLSearchParams(location.search);
 const sender=params.get("sender");
 const wish=params.get("wish");

 if(!sender)return;

 document.getElementById("showSender").textContent=
 "💌 With Love From: "+sender;

 document.getElementById("showWish").textContent=
 wish||"இனிய புத்தாண்டு நல்வாழ்த்துக்கள்! ❤️";

 document.getElementById("intro").classList.add("show");

 animationActive=true;
 animate();

 // 13 fireworks in 5 seconds
 for(let i=0;i<13;i++){
  introTimers.push(setTimeout(()=>{
   if(!animationActive)return;
   rocket();
   // Additional sky explosion
   setTimeout(()=>{
    if(animationActive){
     burst(W*(.1+Math.random()*.8),
           H*(.1+Math.random()*.4),
           i,Math.random()*360);
    }
   },350);
  },i*350));
 }

 introTimers.push(setTimeout(finishIntro,5000));
}

function finishIntro(){
 animationActive=false;
 introTimers.forEach(clearTimeout);
 introTimers=[];
 particles=[];
 rockets=[];
 document.getElementById("intro").classList.remove("show");
}

window.addEventListener("load",startIntro);
</script>
</body>
</html>
