
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080706">

<title>Happy New Year 2027 | VRPAIData</title>
<meta property="og:type" content="website">
<meta property="og:title" content="🎆 Happy New Year 2027 | VRPAIData">
<meta property="og:description" content="✨ இனிய புத்தாண்டு நல்வாழ்த்துக்கள்! Wishing You Happiness, Love & Success! ❤️">
<meta property="og:image" content="https://vrpaidata-source.github.io/New-year-2027/newyear-preview.jpg">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
 width:100%;height:100%;overflow:hidden;
 background:#050403;color:#ffe5a5;
 font-family:Arial,sans-serif;
 overscroll-behavior:none;
}
body{display:flex;align-items:center;justify-content:center}
#app{
 width:min(100vw,56.25svh);
 height:min(100svh,177.7778vw);
 aspect-ratio:9/16;
 position:relative;overflow:hidden;
 background:radial-gradient(ellipse at 50% 35%,#35220b,#100b05 55%,#030303);
 border:1px solid #a77b30;
}
#main{
 position:absolute;inset:0;
 display:flex;flex-direction:column;
 justify-content:space-around;align-items:center;
 padding:5%;
 text-align:center;
}
.logo{
 color:#ffdf8b;font-size:23px;font-weight:bold;
 letter-spacing:4px;text-shadow:0 0 15px #d69a35;
}
.small{font-size:9px;letter-spacing:3px;color:#b99a5c;margin-top:6px}
.title{font:clamp(28px,8vw,45px) Georgia;color:#ffe8b1}
.year{
 font: bold clamp(76px,21vw,110px) Georgia;
 line-height:1.1;
 color:#f9d77d;
 text-shadow:0 0 12px #d69a35,0 0 35px #b27a21;
}
.sub{font-size:12px;line-height:1.8;color:#dfc99a}
.timer{display:flex;gap:5px;width:100%}
.unit{
 flex:1;padding:10px 2px;
 border:1px solid #99732e;border-radius:9px;
 background:#1b1309;
}
.unit b{display:block;font-size:23px;color:#ffe4a1}
.unit span{font-size:8px;color:#bba16b;letter-spacing:1px}
.label{font-size:10px;letter-spacing:3px;margin-bottom:9px}
.panel{
 width:100%;padding:12px;
 border:1px solid #96702f;border-radius:13px;
 background:#150f08;
}
.panel h3{font:17px Georgia;color:#ffe3a0;margin-bottom:8px}
input,textarea{
 display:block;width:100%;margin:5px 0;
 padding:11px;border:1px solid #896629;
 border-radius:7px;background:#080705;
 color:#ffe7ad;font-size:12px;outline:none;
}
textarea{height:65px;resize:none;line-height:1.5}
button{
 padding:12px 18px;border:0;border-radius:30px;
 background:linear-gradient(90deg,#a87520,#ffe9a8,#b27c23);
 color:#160e03;font-size:12px;font-weight:bold;
}
.send{width:100%;margin-top:5px}
.footer{font-size:9px;letter-spacing:2px;color:#a88b55}

/* 7 SECOND WELCOME SHOW */
#intro{
 position:absolute;inset:0;z-index:20;
 display:none;background:#030201;
}
#intro.active{display:block}
#sky{width:100%;height:100%;position:absolute;inset:0}
#introText{
 position:absolute;top:40%;left:5%;width:90%;
 text-align:center;opacity:0;
 animation:reveal .8s ease .4s forwards;
}
@keyframes reveal{
 to{opacity:1;transform:translateY(-10px)}
}
#introText h1{
 font:clamp(48px,14vw,76px) Georgia;
 color:#ffdf8b;text-shadow:0 0 25px #d99a2d;
}
#introText .wish{
 font:17px Georgia;line-height:1.7;
 color:#fff0c7;margin-top:12px;
 overflow-wrap:anywhere;
}
#introText .from{
 color:#e7c57c;font-size:13px;margin-top:17px;
}
</style>
</head>

<body>
<div id="app">

<!-- FIRST PAGE -->
<main id="main">

 <header>
  <div class="logo">VRPAIData</div>
  <div class="small">SPREADING HAPPINESS</div>
 </header>

 <section>
  <div class="title">Happy New Year</div>
  <div class="year">2027</div>
  <div class="sub">
   புதிய நம்பிக்கை • புதிய கனவுகள்<br>
   A New Beginning ❤️
  </div>
 </section>

 <section style="width:100%">
  <div class="label">NEW YEAR COUNTDOWN</div>
  <div class="timer">
   <div class="unit"><b id="days">00</b><span>DAYS</span></div>
   <div class="unit"><b id="hours">00</b><span>HOURS</span></div>
   <div class="unit"><b id="minutes">00</b><span>MINUTES</span></div>
   <div class="unit"><b id="seconds">00</b><span>SECONDS</span></div>
  </div>
 </section>

 <section class="panel">
  <h3>💌 Send Your Wishes</h3>
  <input id="sender" placeholder="Sender Name / அனுப்புநர் பெயர்">

  <textarea id="wish">✨ இனிய புத்தாண்டு நல்வாழ்த்துக்கள்! ❤️
Wishing You Happiness, Love & Success in 2027!</textarea>

  <button class="send" onclick="sendWish()">
   🎁 SEND WISHES
  </button>
  <div id="status" style="font-size:10px;margin-top:7px"></div>
 </section>

 <footer class="footer">WITH LOVE ❤️ VRPAIData</footer>
</main>

<!-- RECEIVER ANIMATION -->
<div id="intro">
 <canvas id="sky"></canvas>
 <div id="introText">
  <div style="font-size:11px;letter-spacing:3px;color:#e9c77c">
   A SPECIAL WISH FOR YOU
  </div>
  <h1>2027</h1>
  <div class="wish" id="showWish"></div>
  <div class="from" id="showSender"></div>
 </div>
</div>

</div>

<script>
// DEFAULT WISH
const defaultWish =
"✨ இனிய புத்தாண்டு நல்வாழ்த்துக்கள்! ❤️\nWishing You Happiness, Love & Success in 2027!";

// COUNTDOWN
function updateTimer(){
 const target=new Date("2027-01-01T00:00:00+05:30").getTime();
 const t=Math.max(0,target-Date.now());

 days.textContent=String(Math.floor(t/86400000)).padStart(2,"0");
 hours.textContent=String(Math.floor(t%86400000/3600000)).padStart(2,"0");
 minutes.textContent=String(Math.floor(t%3600000/60000)).padStart(2,"0");
 seconds.textContent=String(Math.floor(t%60000/1000)).padStart(2,"0");
}
updateTimer();
setInterval(updateTimer,1000);

// SEND PROFESSIONAL WHATSAPP MESSAGE
function sendWish(){
 const name=document.getElementById("sender").value.trim();
 const message=document.getElementById("wish").value.trim();

 if(!name){
  alert("Please enter Sender Name!");
  return;
 }

 // Short link for default wish
 const url=new URL(location.href);
 url.search="";
 url.hash="";
 url.searchParams.set("sender",name);

 if(message===defaultWish){
  url.searchParams.set("wish","default");
 }else{
  url.searchParams.set("wish",message);
 }

 const link=url.toString();

 // Short, professional WhatsApp content
 const text=
 "🎆 Happy New Year 2027!\n"+
 "💌 From: "+name+"\n\n"+
 message+"\n\n"+
 "✨ Open Your Wishes:\n"+link;

 const whatsapp="https://wa.me/?text="+encodeURIComponent(text);

 document.getElementById("status").textContent="Opening WhatsApp...";
 location.href=whatsapp;
}

// FIREWORKS
const canvas=document.getElementById("sky");
const ctx=canvas.getContext("2d");
let W,H,particles=[],rockets=[];
let running=false;
let raf=0;
let launchTimers=[];

function resize(){
 const d=Math.min(devicePixelRatio||1,2);
 W=canvas.clientWidth;
 H=canvas.clientHeight;
 canvas.width=W*d;
 canvas.height=H*d;
 ctx.setTransform(d,0,0,d,0,0);
}
resize();

// 13 FIREWORKS STYLES
function explode(x,y,type){
 const total=type===12?110:75;
 const hue=[45,190,280,0,120,320,55,210,25,160,300,80,15][type];

 for(let i=0;i<total;i++){
  let a=Math.PI*2*i/total;
  let speed=2+Math.random()*3;

  let vx=Math.cos(a)*speed;
  let vy=Math.sin(a)*speed;

  // Different shapes
  switch(type){
   case 0: break; // Round chrysanthemum
   case 1: speed=4;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;break;
   case 2: speed=i%2?5:1.5;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;break;
   case 3: vx*=.5;vy*=1.8;break;
   case 4: vx*=1.7;vy*=.7;break;
   case 5: speed=2+Math.random()*6;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;break;
   case 6: speed=i%3===0?6:2;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;break;
   case 7: a=Math.PI*2*Math.floor(i/5)/15;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;break;
   case 8: vx=Math.cos(a)*speed*1.5;vy=Math.sin(a)*speed*.6;break;
   case 9: vx=Math.cos(a)*speed*.6;vy=Math.sin(a)*speed*1.5;break;
   case 10: speed=3+Math.sin(i*4)*2;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;break;
   case 11: speed=1+Math.random()*7;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;break;
   case 12: speed=2+Math.random()*5;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;break;
  }

  particles.push({
   x,y,vx,vy,
   life:1,
   decay:.009+Math.random()*.01,
   hue:hue+Math.random()*30,
   size:1+Math.random()*2.2
  });
 }
}

// ROCKET FROM BOTTOM TO SKY
function launch(type){
 rockets.push({
  x:W*(.12+Math.random()*.76),
  y:H+5,
  target:H*(.12+Math.random()*.36),
  speed:7+Math.random()*4,
  type
 });
}

function draw(){
 if(!running)return;

 ctx.clearRect(0,0,W,H);

 rockets.forEach((r,i)=>{
  r.y-=r.speed;
  ctx.fillStyle="#ffe5a0";
  ctx.shadowBlur=15;
  ctx.shadowColor="#ffca54";
  ctx.beginPath();
  ctx.arc(r.x,r.y,3,0,Math.PI*2);
  ctx.fill();

  if(r.y<=r.target){
   explode(r.x,r.y,r.type);
   rockets.splice(i,1);
  }
 });

 particles.forEach((p,i)=>{
  p.x+=p.vx;
  p.y+=p.vy;
  p.vy+=.035;
  p.vx*=.985;
  p.vy*=.985;
  p.life-=p.decay;

  ctx.globalAlpha=Math.max(0,p.life);
  ctx.fillStyle=`hsl(${p.hue},100%,70%)`;
  ctx.shadowBlur=9;
  ctx.shadowColor=ctx.fillStyle;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
  ctx.fill();

  if(p.life<=0)particles.splice(i,1);
 });

 ctx.globalAlpha=1;
 ctx.shadowBlur=0;
 raf=requestAnimationFrame(draw);
}

// OPEN RECEIVER LINK
function startWelcome(){
 const params=new URLSearchParams(location.search);
 const sender=params.get("sender");

 if(!sender)return;

 let message=params.get("wish")||"default";
 if(message==="default")message=defaultWish;

 document.getElementById("showSender").textContent="💌 From: "+sender;
 document.getElementById("showWish").textContent=message;

 const intro=document.getElementById("intro");
 intro.classList.add("active");

 running=true;
 draw();

 // Exactly 13 different style launches
 for(let i=0;i<13;i++){
  launchTimers.push(setTimeout(()=>{
   if(running)launch(i);
  },i*450));
 }

 // Automatic 7-second completion
 launchTimers.push(setTimeout(()=>{
  finishWelcome();
 },7000));
}

// NO SKIP BUTTON
function finishWelcome(){
 running=false;
 cancelAnimationFrame(raf);
 launchTimers.forEach(clearTimeout);
 launchTimers=[];
 particles=[];
 rockets=[];
 ctx.clearRect(0,0,W,H);

 document.getElementById("intro").classList.remove("active");

 // Remove received parameters and return to first page
 history.replaceState({}, "", location.pathname);
}

window.addEventListener("load",()=>{
 startWelcome();
});
</script>
</body>
</html>
