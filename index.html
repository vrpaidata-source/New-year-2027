<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080604">
<title>Happy New Year 2027 | VRPAIData</title>
<meta property="og:type" content="website">
<meta property="og:title" content="🎆 Happy New Year 2027 | VRPAIData">
<meta property="og:description" content="✨ இனிய புத்தாண்டு நல்வாழ்த்துக்கள்! Wishing You Happiness, Love & Success in 2027!">
<!-- Replace this with a real, publicly accessible 1200x630 preview image URL -->
<meta property="og:image" content="https://vrpaidata-source.github.io/New-year-2027/newyear-preview.jpg">

<style>
:root{--gold:#f7d98c;--gold2:#b77b23;--ink:#080604}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#050403;color:#fff0c6;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:min(100vw,56.25svh);height:min(100svh,177.7778vw);aspect-ratio:9/16;overflow:hidden;background:#080604;border:1px solid #98702b;isolation:isolate}
#bgVideo,#bgFallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#bgVideo{z-index:-4;filter:brightness(.48) saturate(1.12)}
#bgFallback{z-index:-5;background:radial-gradient(ellipse at 50% 38%,#6c4314 0%,#211506 40%,#050403 100%)}
#videoShade{position:absolute;inset:0;z-index:-3;background:linear-gradient(180deg,#05040366,#08060455 40%,#030201dd)}
#goldDust{position:absolute;inset:0;z-index:-2;pointer-events:none;background-image:radial-gradient(#ffe6a1 1px,transparent 1.5px),radial-gradient(#eab64d 1px,transparent 1.5px);background-size:79px 93px,121px 137px;background-position:0 0,35px 45px;opacity:.28;animation:dust 12s linear infinite}
@keyframes dust{to{background-position:0 -180px,35px -210px}}
#main{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5% 5% 4%;text-align:center}
.brand{font-weight:900;letter-spacing:4px;font-size:clamp(17px,4.5vw,23px);color:var(--gold);text-shadow:0 0 18px #d9982c}
.tag{font-size:8px;letter-spacing:3px;color:#e2c17a;margin-top:5px}
.hero{margin-top:1%}
.heroTitle{font:clamp(28px,8vw,43px) Georgia,serif;color:#fff0c4;text-shadow:0 0 20px #c88b31;animation:floatTitle 3s ease-in-out infinite}
@keyframes floatTitle{50%{transform:translateY(-5px)}}
.year{font:bold clamp(76px,21vw,108px) Georgia,serif;line-height:1.05;color:#ffdf8c;text-shadow:0 0 10px #ffca57,0 0 35px #b77b23;animation:yearGlow 2.4s ease-in-out infinite alternate}
@keyframes yearGlow{to{filter:drop-shadow(0 0 17px #ffcf62)}}
.sub{font-size:11px;line-height:1.7;color:#f0d9a5}
.timerTitle{font-size:9px;letter-spacing:3px;color:#f0d18b;margin-bottom:8px}
.timer{display:flex;gap:5px;width:100%}
.unit{flex:1;min-width:0;padding:9px 2px;border:1px solid #98702b;border-radius:9px;background:#120d08cc;backdrop-filter:blur(5px);box-shadow:0 0 15px #bd852633}
.unit b{display:block;font-size:clamp(18px,5vw,24px);color:#ffe8ae}
.unit span{font-size:7px;letter-spacing:1px;color:#c6a66a}
.panel{width:100%;padding:11px 12px;border:1px solid #9b7535;border-radius:13px;background:#100b07e8;box-shadow:0 8px 25px #0008}
.panel h3{font:16px Georgia,serif;color:#ffe4a1;margin:0 0 7px}
input,textarea{display:block;width:100%;margin:5px 0;padding:10px;border:1px solid #876329;border-radius:7px;background:#080604;color:#fff0c6;font-size:12px;outline:none}
textarea{height:58px;resize:none;line-height:1.45}
button{border:0;border-radius:25px;padding:11px 18px;background:linear-gradient(100deg,#a87520,#ffe9a8,#b27c23);color:#180f03;font-size:12px;font-weight:bold}
.send{width:100%;margin-top:4px}
#status{font-size:9px;color:#e7c77e;min-height:12px;margin-top:5px}
.footer{font-size:8px;letter-spacing:2px;color:#c0a16a}

/* Receiver welcome screen */
#intro{position:absolute;inset:0;z-index:30;display:none;background:radial-gradient(ellipse at center,#241707,#030201 75%);overflow:hidden}
#intro.active{display:block}
#sky{position:absolute;inset:0;width:100%;height:100%}
#introText{position:absolute;left:5%;right:5%;top:40%;text-align:center;opacity:0;animation:reveal .45s ease .15s forwards}
@keyframes reveal{to{opacity:1;transform:translateY(-8px)}}
#introText .eyebrow{font-size:10px;letter-spacing:3px;color:#e9c77c}
#introText h1{font:clamp(48px,14vw,76px) Georgia,serif;color:#ffdf8b;text-shadow:0 0 25px #d99a2d;margin:8px 0}
#showWish{font:16px Georgia,serif;line-height:1.6;color:#fff0c7;white-space:pre-wrap;overflow-wrap:anywhere}
#showSender{font-size:12px;color:#e9c77c;margin-top:15px}
</style>
</head>
<body>
<div id="app">
  <div id="bgFallback"></div>
  <!-- Upload a short, muted, looping MP4 named newyear-bg.mp4 beside index.html -->
  <video id="bgVideo" autoplay muted loop playsinline preload="auto">
    <source src="newyear-bg.mp4" type="video/mp4">
  </video>
  <div id="videoShade"></div>
  <div id="goldDust"></div>

  <main id="main">
    <header>
      <div class="brand">VRPAIData</div>
      <div class="tag">SPREADING HAPPINESS</div>
    </header>

    <section class="hero">
      <div class="heroTitle">Happy New Year</div>
      <div class="year">2027</div>
      <div class="sub">புதிய நம்பிக்கை • புதிய கனவுகள்<br>A Beautiful New Beginning ❤️</div>
    </section>

    <section style="width:100%">
      <div class="timerTitle">NEW YEAR COUNTDOWN</div>
      <div class="timer">
        <div class="unit"><b id="days">00</b><span>DAYS</span></div>
        <div class="unit"><b id="hours">00</b><span>HOURS</span></div>
        <div class="unit"><b id="minutes">00</b><span>MINUTES</span></div>
        <div class="unit"><b id="seconds">00</b><span>SECONDS</span></div>
      </div>
    </section>

    <section class="panel">
      <h3>💌 Send Your Wishes</h3>
      <input id="sender" maxlength="45" placeholder="Sender Name / அனுப்புநர் பெயர்">
      <textarea id="wish" maxlength="180">✨ இனிய புத்தாண்டு நல்வாழ்த்துக்கள்! ❤️
Wishing You Happiness, Love & Success in 2027!</textarea>
      <button class="send" onclick="sendWish()">🎁 SEND WISHES</button>
      <div id="status"></div>
    </section>
    <footer class="footer">WITH LOVE ❤️ VRPAIData</footer>
  </main>

  <section id="intro" aria-label="New Year greeting animation">
    <canvas id="sky"></canvas>
    <div id="introText">
      <div class="eyebrow">A SPECIAL WISH FOR YOU</div>
      <h1>2027</h1>
      <div id="showWish"></div>
      <div id="showSender"></div>
    </div>
  </section>
</div>

<script>
// Countdown (India Standard Time)
function updateTimer(){
  const target=new Date("2027-01-01T00:00:00+05:30").getTime();
  const t=Math.max(0,target-Date.now());
  document.getElementById("days").textContent=String(Math.floor(t/86400000)).padStart(2,"0");
  document.getElementById("hours").textContent=String(Math.floor(t%86400000/3600000)).padStart(2,"0");
  document.getElementById("minutes").textContent=String(Math.floor(t%3600000/60000)).padStart(2,"0");
  document.getElementById("seconds").textContent=String(Math.floor(t%60000/1000)).padStart(2,"0");
}
updateTimer(); setInterval(updateTimer,1000);

// Default message
const DEFAULT_WISH="✨ இனிய புத்தாண்டு நல்வாழ்த்துக்கள்! ❤️\nWishing You Happiness, Love & Success in 2027!";

// Share: compact WhatsApp text, URL carries sender + message
async function sendWish(){
  const name=document.getElementById("sender").value.trim();
  const message=document.getElementById("wish").value.trim()||DEFAULT_WISH;
  if(!name){alert("Please enter Sender Name / அனுப்புநர் பெயர்");return;}

  const url=new URL(location.href);
  url.search="";
  url.searchParams.set("sender",name);
  // Keep the standard greeting link short; only custom edits go in the URL.
  url.searchParams.set("wish",message===DEFAULT_WISH ? "default" : message);

  const link=url.toString();
  const shareText="🎆 Happy New Year 2027!\n💌 From: "+name+
    "\n\n✨ Open Your Wishes:\n"+link;

  if(navigator.share){
    try{await navigator.share({title:"Happy New Year 2027 | VRPAIData",text:shareText});}
    catch(e){/* user cancelled share sheet */}
  }else{
    location.href="https://wa.me/?text="+encodeURIComponent(shareText);
  }
}

// Fireworks canvas: all 13 bursts launch early; leave time for particles to fade
const canvas=document.getElementById("sky");
const ctx=canvas.getContext("2d");
let W=0,H=0,particles=[],rockets=[],raf=0,running=false,startedAt=0;
const COLORS=[42,190,280,0,120,320,55,210,25,160,300,80,15];

function resizeCanvas(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  W=canvas.clientWidth; H=canvas.clientHeight;
  canvas.width=Math.max(1,Math.floor(W*dpr));
  canvas.height=Math.max(1,Math.floor(H*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resizeCanvas);

function launchRocket(type){
  rockets.push({
    x:W*(.12+Math.random()*.76),y:H+8,
    target:H*(.13+Math.random()*.32),
    speed:11+Math.random()*3,type
  });
}

// 13 distinct burst patterns
function explode(x,y,type){
  const count=type===12?105:78;
  const hue=COLORS[type];
  for(let i=0;i<count;i++){
    const a=Math.PI*2*i/count;
    let speed=2.6+Math.random()*2.2;
    let vx=Math.cos(a)*speed,vy=Math.sin(a)*speed;
    switch(type){
      case 0: break; // sphere
      case 1: speed=4.4;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;break; // peony
      case 2: speed=i%2?5.2:1.4;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;break; // star
      case 3: vx*=.55;vy*=1.7;break; // willow
      case 4: vx*=1.65;vy*=.7;break; // wide ring
      case 5: speed=1.5+Math.random()*6;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;break; // chrysanthemum
      case 6: speed=i%3===0?6:2;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;break; // multi-layer
      case 7: {const aa=Math.PI*2*Math.floor(i/5)/16;vx=Math.cos(aa)*speed;vy=Math.sin(aa)*speed;break;} // flower
      case 8: vx=Math.cos(a)*speed*1.5;vy=Math.sin(a)*speed*.6;break; // oval
      case 9: vx=Math.cos(a)*speed*.6;vy=Math.sin(a)*speed*1.5;break; // vertical
      case 10: speed=3+Math.sin(i*4)*2;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;break; // ripple
      case 11: speed=1+Math.random()*7;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;break; // glitter
      case 12: speed=2+Math.random()*5;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;break; // grand finale
    }
    particles.push({x,y,vx,vy,life:1,decay:.012+Math.random()*.009,hue:hue+Math.random()*28,size:1+Math.random()*2.1});
  }
}

function frame(){
  if(!running)return;
  ctx.clearRect(0,0,W,H);

  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];r.y-=r.speed;
    ctx.save();ctx.fillStyle="#fff0b4";ctx.shadowBlur=13;ctx.shadowColor="#ffbd43";
    ctx.beginPath();ctx.arc(r.x,r.y,3,0,Math.PI*2);ctx.fill();ctx.restore();
    if(r.y<=r.target){explode(r.x,r.y,r.type);rockets.splice(i,1);}
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.025;p.vx*=.986;p.vy*=.986;p.life-=p.decay;
    ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=`hsl(${p.hue},100%,72%)`;
    ctx.shadowBlur=8;ctx.shadowColor=ctx.fillStyle;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.restore();
    if(p.life<=0)particles.splice(i,1);
  }
  raf=requestAnimationFrame(frame);
}

function finishIntro(){
  running=false;cancelAnimationFrame(raf);
  rockets=[];particles=[];
  ctx.clearRect(0,0,W,H);
  document.getElementById("intro").classList.remove("active");
  // Return to clean first-page URL after showing the greeting
  history.replaceState({},document.title,location.pathname);
}

function startWelcome(){
  const params=new URLSearchParams(location.search);
  const sender=params.get("sender");
  if(!sender)return;

  let wish=params.get("wish")||"default";
  if(wish==="default")wish=DEFAULT_WISH;
  document.getElementById("showSender").textContent="💌 From: "+sender;
  document.getElementById("showWish").textContent=wish;

  resizeCanvas();
  document.getElementById("intro").classList.add("active");
  running=true;
  startedAt=performance.now();
  frame();

  // All 13 rockets launch during the first 2.6 seconds.
  // Faster upward speed means all bursts happen early; remaining time is for full fade-out.
  for(let i=0;i<13;i++){
    setTimeout(()=>{if(running)launchRocket(i);},i*190);
  }

  // Fixed 7-second welcome, then automatically show the first page.
  setTimeout(()=>{if(running)finishIntro();},7000);
}

window.addEventListener("load",()=>{
  const video=document.getElementById("bgVideo");
  video.play().catch(()=>{});
  startWelcome();
});
</script>
</body>
</html>
